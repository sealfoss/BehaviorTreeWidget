name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: python -m ruff check src tests tools examples
      - name: mypy
        run: python -m mypy
      - name: Generated forms match the .ui files
        run: python tools/compile_ui.py --check

  test:
    name: Tests (Python ${{ matrix.python-version }}${{ matrix.oldest && ', oldest dependencies' || '' }}, Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        oldest: [false]
        include:
          - python-version: "3.13"  # the oldest Python with the oldest PySide6 and py_trees supported
            oldest: true
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]" ${{ matrix.oldest && '-c .github/minimum-versions.txt' || '' }}
      - name: pytest
        run: python -m pytest -n auto

  build:
    name: Wheel and sdist
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build  # the forms check needs neither Qt nor py_trees
          python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
