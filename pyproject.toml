[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-tree-widget"
dynamic = ["version"]
description = "A PySide6 widget to build and execute py_trees behavior trees graphically"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "py_trees>=2.2.1",
]
keywords = ["behavior tree", "py_trees", "PySide6", "Qt", "widget", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Software Development :: Widget Sets",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-qt>=4.2", "pytest-timeout>=2", "pytest-xdist>=3"]
dev = ["behavior-tree-widget[test]", "ruff>=0.6", "mypy>=1.10", "build>=1"]

[project.gui-scripts]
behavior-tree-widget-demo = "behavior_tree_widget.demo:main"

[tool.setuptools.dynamic]
version = { attr = "behavior_tree_widget.__version__" }

[tool.setuptools.package-data]
behavior_tree_widget = ["ui/*.ui", "py.typed"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
timeout = 120
# Performance tests are opt-in: pytest -m perf (without -n, so they do not compete for the CPU).
addopts = "-m 'not perf'"
markers = ["perf: performance test with a time limit; deselected unless -m perf is given"]
# Internal code must never use deprecated APIs; tests that check them opt out with a filterwarnings mark.
filterwarnings = ['error:.*is deprecated; use:DeprecationWarning']

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/behavior_tree_widget/_forms"]  # generated by tools/compile_ui.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "BLE", "SIM", "UP", "C4", "RUF"]
ignore = [
    "N802",    # the public API uses CamelCase methods (GetEntry, OnRun), and Qt overrides are mixedCase
    "N815",    # Qt signals are mixedCase class attributes (treeLoaded = Signal(str))
    "RUF012",  # class-level _fields / _title templates are the documented way to declare node fields
    "SIM105",  # try / except / pass with a comment saying why reads better than contextlib.suppress here
]

[tool.ruff.lint.isort]
known-first-party = ["behavior_tree_widget"]
known-local-folder = ["conftest", "support"]  # the test suite's own modules

[tool.ruff.lint.pyflakes]
# The support modules of the test suite define pytest fixtures that test modules import by name.
allowed-unused-imports = ["support"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E501",    # long test names, ids and expected texts
    "F811",    # a test's argument named like the fixture it imports from a support module
    "RUF005",  # [*a, b] vs a + [b]: either reads fine in test data
    "RUF059",  # unpacking a value to check its shape names the parts the test ignores
    "SIM115",  # helpers that open a file briefly to read test data
]
